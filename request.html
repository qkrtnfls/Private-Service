<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        <span>902</span>
        <small>PRIVATE SERVICE</small>
    </a>

    <nav class="nav">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="service.html">SERVICE</a>
        <a href="notice.html">NOTICE</a>
        <a href="review.html">REVIEW</a>
        <a href="request.html">REQUEST</a>
    </nav>

</header>


<main class="request-page">

    <section class="request-title">

        <div class="section-number">
            REQUEST / 01
        </div>

        <h1>
            TELL US<br>
            YOUR PROBLEM.
        </h1>

        <p>
            의뢰 내용을 작성해 주세요.<br>
            확인 후 담당자가 연락드립니다.
        </p>

    </section>


    <section class="request-form-section" id="requestForm">

        <form class="request-form">

           <div class="form-group">
                    <label for="name">
                        NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="이름을 입력해 주세요."
                    >

                    <p class="field-error"></p>
                </div>


                            <div class="form-group">
                    <label for="contact">
                        CONTACT
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="연락 가능한 번호 또는 이메일"
                    >

                    <p class="field-error"></p>
                </div>


                        <div class="form-group">
                    <label for="category">
                        REQUEST TYPE
                    </label>

                    <select id="category" name="category">
                        <option value="">선택해 주세요.</option>
                        <option value="personal">PERSONAL ASSISTANCE</option>
                        <option value="information">INFORMATION COLLECTION</option>
                        <option value="special">SPECIAL REQUEST</option>
                        <option value="problem">PROBLEM SOLVING</option>
                        <option value="other">OTHER</option>
                    </select>

                    <p class="field-error"></p>
                </div>
                            <div class="form-group">
                    <label for="target">
                        SUBJECT
                    </label>

                    <input
                        type="text"
                        id="target"
                        name="target"
                        placeholder="관련된 대상 또는 장소"
                    >

                    <p class="field-error"></p>
                </div>


                            <div class="form-group">
                    <label for="message">
                        REQUEST DETAILS
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="의뢰 내용을 가능한 한 구체적으로 작성해 주세요."
                    ></textarea>

                    <p class="field-error"></p>
                </div>


            <div class="form-notice">
                <p>
                    * 입력하신 내용은 상담 및 의뢰 진행을 위해서만 사용됩니다.
                </p>

                <p>
                    * 모든 의뢰가 접수되는 것은 아닙니다.
                </p>
            </div>


            <button type="submit" class="submit-button">
                SUBMIT REQUEST
                <span>→</span>
            </button>

        </form>

    </section>


    <section class="request-bottom">

        <p>
            YOUR INFORMATION WILL BE<br>
            TREATED CONFIDENTIALLY.
        </p>

    </section>

</main>


<footer class="footer">
    <span>902 PRIVATE SERVICE</span>
    <span>© 2026 902</span>
</footer>

<script src="js/script.js"></script>
</body>
</html>
