            <!-- RIGHT : CCTV -->

                    <!-- SCANLINE -->

                    <!-- VIGNETTE -->

                    <div class="cctv-top">


                        <div class="cctv-rec">

                            <span class="rec-dot"></span>

                                REC
                            </span>

                        </div>


                        <div class="cctv-camera">

                        </div>

                    <!-- DATE / TIME -->

                        <div
                            class="cctv-date"
                            id="cctvDate"
                        >

    <!-- =========================
         SCRIPT
    ========================== -->

    <script src="js/script.js"></script>


    <!-- CCTV REAL-TIME CLOCK -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                var cctvDate =
                    document.querySelector(
                        "#cctvDate"
                    );


                var cctvTime =
                    document.querySelector(
                        "#cctvTime"
                    );


                if (
                    !cctvDate ||
                    !cctvTime
                ) {

                    return;

                }



                function updateCCTV() {


                    var now =
                        new Date();



                    var year =
                        now.getFullYear();



                    var month =
                        String(
                            now.getMonth() + 1
                        ).padStart(
                            2,
                            "0"
                        );



                    var day =
                        String(
                            now.getDate()
                        ).padStart(
                            2,
                            "0"
                        );



                    var hours =
                        String(
                            now.getHours()
                        ).padStart(
                            2,
                            "0"
                        );



                    var minutes =
                        String(
                            now.getMinutes()
                        ).padStart(
                            2,
                            "0"
                        );



                    var seconds =
                        String(
                            now.getSeconds()
                        ).padStart(
                            2,
                            "0"
                        );



                    cctvDate.textContent =
                        year +
                        "-" +
                        month +
                        "-" +
                        day;



                    cctvTime.textContent =
                        hours +
                        ":" +
                        minutes +
                        ":" +
                        seconds;

                }



                updateCCTV();



                setInterval(
                    updateCCTV,
                    1000
                );


            }
        );

    </script>


</body>
